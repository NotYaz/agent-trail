name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Test and build (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Show toolchain
        run: swift --version
      - name: Run tests
        run: swift test
      - name: Package native app
        env:
          TARGET_ARCH: ${{ matrix.arch }}
        run: ./scripts/build-app.sh --arch "$TARGET_ARCH"
      - name: Verify archive checksum
        env:
          TARGET_ARCH: ${{ matrix.arch }}
        working-directory: dist
        run: LC_ALL=C shasum -a 256 -c "Agent-Trail-macOS-$TARGET_ARCH.zip.sha256"
