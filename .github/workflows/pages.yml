name: Pages

# Publishes site/ to GitHub Pages from main. Pull requests only run the checks.
# Deploying needs Pages enabled with "GitHub Actions" as the source in the
# repository settings; this workflow never turns Pages on by itself.
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "docs/SUPPORT.md"
      - "docs/assets/donate-*.png"
      - ".github/workflows/pages.yml"
  pull_request:
    paths:
      - "site/**"
      - "docs/SUPPORT.md"
      - "docs/assets/donate-*.png"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Check and package site
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # docs/SUPPORT.md is the canonical list. The site must show exactly the
      # same addresses and QR codes, so a change to one cannot drift from the other.
      - name: Check donation addresses against docs/SUPPORT.md
        run: |
          pattern='\b(bc1[02-9ac-hj-np-z]{25,87}|0x[0-9a-fA-F]{40}|T[1-9A-HJ-NP-Za-km-z]{33})\b'
          canonical=$(grep -oE "$pattern" docs/SUPPORT.md | sort -u)
          published=$(grep -oE "$pattern" site/index.html | sort -u)
          if [ -z "$canonical" ] || [ "$canonical" != "$published" ]; then
            echo "::error file=site/index.html::Donation addresses differ from docs/SUPPORT.md"
            diff <(echo "$canonical") <(echo "$published") || true
            exit 1
          fi
          for qr in donate-btc donate-evm donate-tron; do
            cmp "docs/assets/$qr.png" "site/assets/$qr.png"
          done
      - name: Check local references
        run: |
          missing=0
          for ref in $(grep -oE '(src|href|srcset)="[^"#:]+"' site/index.html | cut -d'"' -f2 | sort -u); do
            if [ ! -f "site/$ref" ]; then
              echo "::error file=site/index.html::Missing file: $ref"
              missing=1
            fi
          done
          exit "$missing"
      - name: Upload site
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
